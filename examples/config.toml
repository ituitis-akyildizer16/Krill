# Sample config - copy to ~/.config/krill/config.toml and edit.

model = "qwen2.5-coder:7b"
shell = "bash"
theme = "dark"
cache_ttl_seconds = 3600
no_color = false

[context]
max_blame_lines = 400
max_diff_lines = 600
history_days = 14

[ollama]
url = "http://localhost:11434"
timeout_seconds = 120

[suggest]
max_tokens = 60
use_local_model = true
deny_patterns = ["rm -rf /", "mkfs", ":(){"]
warn_patterns = ["rm ", "drop ", "git push --force", "shutdown"]

[plugins]
enabled = false
dir = "~/.config/krill/plugins"
providers = []

[ignore]
paths = ["node_modules", ".git", "vendor", "dist"]
