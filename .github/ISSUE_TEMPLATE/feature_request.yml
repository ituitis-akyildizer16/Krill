name: Feature request
description: Propose a new capability
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Go core (CLI)
        - VS Code extension
        - Python plugin SDK
        - Completions / docs
    validations:
      required: true