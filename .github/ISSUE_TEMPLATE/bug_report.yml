name: Bug report
description: File a bug report
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command, the output, and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: krill version (run `krill version`)
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Go core (CLI)
        - VS Code extension
        - Python plugin SDK
        - Completions / docs
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true